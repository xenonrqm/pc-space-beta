<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PC-SPACE PC Builder</title><link rel="icon" type="image/png" href="images/bdo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="styleBuilder.css"><script src="https://kit.fontawesome.com/83badc134c.js" crossorigin="anonymous"></script><script src="common.js" defer></script><script src="scriptBuilder.js" defer></script></head><body><header><h2><a href="index.html">PC-SPACE</a></h2><button id="adminBtn"><i class="fa-solid fa-user-tie"></i> Admin</button></header><nav><button onclick="location.href='index.html'"><i class="fa-solid fa-house"></i> Home</button> <button onclick="location.href='indexBuilder.html'"><i class="fa-solid fa-computer"></i> PC Builder</button> <button onclick="location.href='indexCatalog.html'"><i class="fa-solid fa-bag-shopping"></i> Catalog</button> <button data-demo><i class="fa-solid fa-bolt"></i> Flash Deals</button> <button id="cartBtn"><i class="fa-solid fa-cart-shopping"></i> Cart</button> <button data-demo><i class="fa-solid fa-user"></i> Account</button></nav><main class="builder"><h1 class="builder-title">PC Builder</h1><div class="builder-bar"><input type="text" id="buildName" value="My build" maxlength="40" aria-label="Build name"> <button class="btn-line" id="exportBtn">Export PDF</button></div><div class="builder-grid"><div class="parts-card"><div class="parts-head"><h2 id="partsCount">Parts</h2><label class="check"><input type="checkbox" id="stockOnly" checked> In stock only</label></div><div class="table-wrap"><table><thead><tr><th>Slot</th><th>Part</th><th>Qty</th><th class="num">Price</th><th>Stock</th><th></th></tr></thead><tbody id="slotBody"></tbody></table></div></div><aside class="builder-side"><div class="total-card"><p class="total-label" id="subLabel">Subtotal</p><p class="total-value" id="subValue">₱0</p><button class="btn-yellow" id="addAllBtn">Add all to cart</button><div class="total-row"><button class="btn-ghost" id="clearBtn">Clear</button></div></div><div class="side-card"><h3>Where the money goes</h3><div class="money-bar" id="moneyBar"></div><ul class="money-legend" id="moneyLegend"></ul></div></aside></div></main><div class="picker-overlay" id="picker"><div class="picker" role="dialog" aria-modal="true" aria-labelledby="pickerTitle"><div class="picker-head"><button class="picker-back" id="pickerBack" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button><div><small>CHOOSING A PART FOR</small><h2 id="pickerTitle"></h2></div><input type="search" id="pickerSearch" placeholder="Search by brand or name" aria-label="Search parts"></div><div class="picker-tabs" id="pickerTabs"></div><div class="picker-body"><aside class="filters" id="filters"></aside><div class="picker-main"><div class="picker-tools"><button class="pill active" id="pickerStock"><i class="fa-solid fa-check"></i> In stock only</button> <span class="picker-count" id="pickerCount"></span> <label class="sort">Sort <select id="pickerSort"><option value="rec">Recommended</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select> </label></div><div class="table-wrap"><table><thead><tr><th>Product</th><th>Brand</th><th class="num">Price</th><th></th></tr></thead><tbody id="pickerBody"></tbody></table></div></div></div></div></div><footer><div class="footer-brand"><h2>PC-SPACE</h2></div><div class="footer-bottom"><p>All rights reserved</p><p>Created by Group 1</p></div></footer></body></html>
